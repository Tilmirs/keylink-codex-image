name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: Unix - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n install.sh
          bash -n tests/test_install.sh
      - name: Run Node runtime tests
        shell: bash
        run: node ./tests/test_node_runtime.js
      - name: Run Unix installer tests
        shell: bash
        run: bash ./tests/test_install.sh
      - name: Validate YAML metadata
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML
          python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('agents/openai.yaml').read_text())"

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run generator tests
        shell: pwsh
        run: .\tests\test_generate_image.ps1
      - name: Run model discovery tests
        shell: pwsh
        run: .\tests\test_list_image_models.ps1
      - name: Run installer tests
        shell: pwsh
        run: .\tests\test_install.ps1
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failures = @()
          foreach ($file in Get-ChildItem -Path . -Recurse -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failures += $file.FullName
            }
          }
          if ($failures.Count -gt 0) {
            throw ('PowerShell parse failures: ' + ($failures -join ', '))
          }
